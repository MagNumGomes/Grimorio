<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2f2432" />
      <stop offset="50%" stop-color="#403243" />
      <stop offset="100%" stop-color="#25221d" />
    </linearGradient>
    <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f3d9a0" />
      <stop offset="50%" stop-color="#c38b32" />
      <stop offset="100%" stop-color="#f3d9a0" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3d9a0" />
      <stop offset="50%" stop-color="#c38b32" />
      <stop offset="100%" stop-color="#a17227" />
    </linearGradient>
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5c4b5d" />
      <stop offset="100%" stop-color="#403243" />
    </linearGradient>
    <linearGradient id="sageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#778b72" />
      <stop offset="100%" stop-color="#5c6e58" />
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#19151c" flood-opacity="0.5" />
    </filter>
    <filter id="inner-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#25221d" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Fundo do Banner -->
  <rect width="1200" height="400" fill="url(#bannerBg)" />

  <!-- Geometria mística e constelações decorativas -->
  <g opacity="0.25">
    <circle cx="200" cy="200" r="165" fill="none" stroke="#f3d9a0" stroke-width="1.5" stroke-dasharray="6,8" />
    <circle cx="200" cy="200" r="145" fill="none" stroke="#5c4b5d" stroke-width="2" />
    <circle cx="200" cy="200" r="188" fill="none" stroke="#c38b32" stroke-width="1" stroke-dasharray="2,12" />
    <circle cx="1020" cy="180" r="130" fill="none" stroke="#f3d9a0" stroke-width="1" stroke-dasharray="4,6" />
    <circle cx="1020" cy="180" r="150" fill="none" stroke="#778b72" stroke-width="1.5" stroke-dasharray="2,8" />
    <line x1="60" y1="50" x2="200" y2="200" stroke="#f3d9a0" stroke-width="1" />
    <line x1="200" y1="200" x2="340" y2="350" stroke="#f3d9a0" stroke-width="1" />
    <line x1="900" y1="70" x2="1020" y2="180" stroke="#c38b32" stroke-width="1" />
    <line x1="1020" y1="180" x2="1140" y2="330" stroke="#c38b32" stroke-width="1" />
    <text x="60" y="52" font-family="serif" font-size="14" fill="#f3d9a0" text-anchor="middle">✦</text>
    <text x="340" y="352" font-family="serif" font-size="14" fill="#f3d9a0" text-anchor="middle">✦</text>
    <text x="900" y="72" font-family="serif" font-size="14" fill="#c38b32" text-anchor="middle">◈</text>
    <text x="1140" y="332" font-family="serif" font-size="14" fill="#c38b32" text-anchor="middle">✦</text>
  </g>

  <!-- LIVRO PADRONIZADO (EXATAMENTE IGUAL AO LOGO.SVG) -->
  <g transform="translate(-1, -9) scale(0.78)" filter="url(#soft-shadow)">
    <!-- Páginas de pergaminho atrás da capa frontal -->
    <!-- Página de base -->
    <path d="M148 108 C148 108 240 100 376 108 C388 108 396 118 396 130 L396 394 C396 406 388 416 376 416 C240 408 148 416 148 416 Z" fill="#e3dacb" />
    <!-- Bloco principal de folhas (pergaminho) -->
    <path d="M144 112 C144 112 238 104 372 112 C382 112 390 120 390 130 L390 390 C390 400 382 408 372 408 C238 400 144 408 144 408 Z" fill="#f6f1e8" />
    <path d="M372 116 L384 122 L384 394 L372 388 Z" fill="#ead8b5" opacity="0.8" />

    <!-- Fita Marcadora de Página (Sálvia) pendurada -->
    <path d="M228 106 L228 444 L244 428 L260 444 L260 106 Z" fill="url(#sageGrad)" filter="url(#inner-shadow)" />
    <!-- Detalhe dourado na fita -->
    <line x1="234" y1="416" x2="254" y2="416" stroke="#f3d9a0" stroke-width="2" />

    <!-- Capa Frontal do Grimório (Ameixa elegante) -->
    <path d="M136 100 C136 100 240 92 366 100 C378 100 386 110 386 122 L386 388 C386 400 378 410 366 410 C240 402 136 410 136 410 Z" fill="url(#coverGrad)" />
    
    <!-- Lombada / Dobra do Livro à esquerda -->
    <path d="M120 106 C120 98 128 92 138 96 L154 102 L154 414 L138 420 C128 424 120 418 120 410 Z" fill="#2f2432" />
    <!-- Costura dourada na lombada -->
    <line x1="137" y1="126" x2="137" y2="390" stroke="#c38b32" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 14" />
    
    <!-- Moldura ornamental de ouro na capa -->
    <rect x="168" y="132" width="194" height="248" rx="8" fill="none" stroke="url(#goldGrad)" stroke-width="3" />
    <rect x="176" y="140" width="178" height="232" rx="4" fill="none" stroke="#a17227" stroke-width="1" opacity="0.6" />

    <!-- Cantoneiras ornamentais arcanas da moldura -->
    <!-- Top-Left -->
    <path d="M168 152 L168 132 L188 132" fill="none" stroke="#f3d9a0" stroke-width="4" />
    <circle cx="186" cy="150" r="3" fill="#c38b32" />
    <!-- Top-Right -->
    <path d="M362 152 L362 132 L342 132" fill="none" stroke="#f3d9a0" stroke-width="4" />
    <circle cx="344" cy="150" r="3" fill="#c38b32" />
    <!-- Bottom-Left -->
    <path d="M168 360 L168 380 L188 380" fill="none" stroke="#f3d9a0" stroke-width="4" />
    <circle cx="186" cy="362" r="3" fill="#c38b32" />
    <!-- Bottom-Right -->
    <path d="M362 360 L362 380 L342 380" fill="none" stroke="#f3d9a0" stroke-width="4" />
    <circle cx="344" cy="362" r="3" fill="#c38b32" />

    <!-- SÍMBOLO CENTRAL: Pentagrama / Losango Arcano + Checkmark de Produtividade -->
    <!-- Disco místico central -->
    <circle cx="265" cy="256" r="54" fill="#2f2432" stroke="url(#goldGrad)" stroke-width="2.5" />
    <circle cx="265" cy="256" r="48" fill="none" stroke="#c38b32" stroke-width="1" stroke-dasharray="4,4" opacity="0.7" />

    <!-- Glifo de Losango Místico (◈) estilizado -->
    <polygon points="265,216 297,256 265,296 233,256" fill="none" stroke="#f3d9a0" stroke-width="2" opacity="0.6" />

    <!-- Símbolo de Conclusão / Checkmark Dourado Nobre integrado ao glifo -->
    <path d="M247 257 L259 269 L285 241" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Pequenas estrelas arcanas (✦) circundantes -->
    <text x="265" y="196" font-family="serif" font-size="16" fill="#f3d9a0" text-anchor="middle">✦</text>
    <text x="265" y="328" font-family="serif" font-size="16" fill="#f3d9a0" text-anchor="middle">◈</text>
    <text x="206" y="262" font-family="serif" font-size="14" fill="#c38b32" text-anchor="middle">☾</text>
    <text x="324" y="262" font-family="serif" font-size="14" fill="#c38b32" text-anchor="middle">☽</text>
  </g>

  <!-- TEXTOS E TIPOGRAFIA (À Direita) -->
  <g transform="translate(420, 0)">
    <!-- Eyebrow sutil -->
    <g transform="translate(0, 120)">
      <line x1="0" y1="0" x2="40" y2="0" stroke="#c38b32" stroke-width="1.5" opacity="0.6" />
      <text x="50" y="4" font-family="serif" font-size="13" fill="#f3d9a0" text-anchor="middle">✦</text>
      <line x1="60" y1="0" x2="100" y2="0" stroke="#c38b32" stroke-width="1.5" opacity="0.6" />
      <text x="114" y="5" font-family="sans-serif" font-size="13" font-weight="600" letter-spacing="3" fill="#c38b32">ORGANIZADOR PESSOAL</text>
    </g>

    <!-- Título Principal -->
    <text x="0" y="200" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="bold" letter-spacing="2" fill="url(#goldTextGrad)">Grimório</text>

    <!-- Subtítulo / Descrição atualizada -->
    <text x="2" y="246" font-family="sans-serif" font-size="18" fill="#f6f1e8" opacity="0.95">Domine sua rotina com a temática arcana.</text>

    <!-- Divisória decorativa sutil e elegante -->
    <g transform="translate(2, 280)" opacity="0.5">
      <line x1="0" y1="0" x2="220" y2="0" stroke="#c38b32" stroke-width="1.5" />
      <text x="235" y="4" font-family="serif" font-size="13" fill="#f3d9a0" text-anchor="middle">◈</text>
      <line x1="250" y1="0" x2="470" y2="0" stroke="#c38b32" stroke-width="1.5" />
    </g>
  </g>
</svg>
